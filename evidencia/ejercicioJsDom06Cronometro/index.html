
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Manejo del DOM 006</title>
</head>

<body>
    <div class="stopWatch">
        <h1 class="time">00:00:00</h1>
        <div class="controls">
            <img src="https://cdn-icons-png.flaticon.com/512/91/91266.png" onclick="stopTimer()" alt="stop">
            <img src="https://cdn-icons-png.freepik.com/512/98/98690.png" onclick="startTimer()" alt="start">
            <img src="https://cdn-icons-png.flaticon.com/512/1142/1142347.png" onclick="resetTimer()" alt="reset">
        </div>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
